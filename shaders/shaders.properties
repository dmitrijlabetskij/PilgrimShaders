# LumenLite Shaderpack Configuration (Iris / OptiFine)

# Disable vanilla clouds in favor of single-pass analytical ALU clouds
clouds = off

# Separate vanilla smooth-lighting AO into vaColor.a on terrain so biome tints stay clean
separateAo = true

# Disable vanilla directional face shading & fixed handlight
oldLighting = false
oldHandLight = false

# Disable vanilla vignette (we use subtle linear-space vignette in final.fsh if enabled)
vignette = false

# Separate translucent entities (e.g. player entityTranslucent) into post-deferred pass
separateEntityDraws = true

# Never alpha-blend packed normal/lightmap/matId buffer colortex1
blend.gbuffers_terrain.colortex1 = off
blend.gbuffers_entities.colortex1 = off
blend.gbuffers_block.colortex1 = off
blend.gbuffers_hand.colortex1 = off

# Shadow pass culling optimizations (skip block-entity & particle shadow draw calls)
shadow.culling = true
shadowEntities = true
shadowBlockEntities = false
shadowParticles = false

# Shadow map configuration (matched by const declarations in shader code)
shadowHardwareFiltering = true
shadowtex0HardwareFiltering = true

# Iris shader options GUI layout
screen = [shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_DISTORTION] [CLOUDS_ENABLED WAVE_ANIMATION DYNAMIC_HANDLIGHT] [TONEMAP_MODE EXPOSURE SATURATION CONTRAST FOG_DENSITY]
